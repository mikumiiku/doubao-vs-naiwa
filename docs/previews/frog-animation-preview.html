<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/">
  <title>奶蛙动作预览</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; color: #fdf3d8; background: #192a24; font: 16px system-ui, "Microsoft YaHei", sans-serif; }
    h1 { font-size: 24px; margin: 0 0 16px; }
    button { border: 1px solid #ffd54a; border-radius: 6px; padding: 10px 18px; margin: 0 8px 16px 0; color: #192a24; background: #ffd54a; cursor: pointer; font: inherit; }
    button:hover { filter: brightness(1.12); }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    button:active { transform: translateY(1px); }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    figure { margin: 0; background: #263d34; border-radius: 8px; }
    figcaption { padding: 12px 16px; }
    canvas { display: block; width: 100%; aspect-ratio: 320 / 260; }
    #status { min-height: 24px; }
  </style>
</head>
<body>
  <h1>奶蛙动作预览</h1>
  <button id="toggle" type="button">暂停播放</button>
  <button id="step" type="button">下一帧</button>
  <button id="replay" type="button">重播倒地</button>
  <audio controls preload="metadata" src="assets/audio/andy.m4a" aria-label="安迪死亡音效"></audio>
  <p id="status" role="status">加载中…</p>
  <main>
    <figure><figcaption>正常走路 <span class="phase"></span></figcaption><canvas data-animation="walk" width="320" height="260"></canvas></figure>
    <figure><figcaption>断手走路 <span class="phase"></span></figcaption><canvas data-animation="walk_b" width="320" height="260"></canvas></figure>
    <figure><figcaption>断手大笑</figcaption><canvas data-animation="laugh_b" width="320" height="260"></canvas></figure>
    <figure><figcaption>断手倒地</figcaption><canvas data-animation="death_b" width="320" height="260"></canvas></figure>
  </main>
  <script type="module">
    import { Assets } from '/src/core/assets.ts';
    import { Anim } from '/src/core/anim.ts';
    const status = document.querySelector('#status');
    const assets = new Assets();
    try {
      await assets.load();
      const views = [...document.querySelectorAll('canvas')].map((canvas) => ({
        ctx: canvas.getContext('2d'),
        phase: canvas.parentElement.querySelector('.phase'),
        anim: new Anim(assets, 'laugh_frog', canvas.dataset.animation, canvas.dataset.animation !== 'death_b'),
      }));
      let paused = false;
      let last = performance.now();
      document.querySelector('#toggle').addEventListener('click', (event) => {
        paused = !paused;
        event.target.textContent = paused ? '继续播放' : '暂停播放';
      });
      document.querySelector('#replay').addEventListener('click', () => {
        const death = views[3].anim;
        death.t = 0;
        death.finished = false;
      });
      document.querySelector('#step').addEventListener('click', () => {
        paused = true;
        document.querySelector('#toggle').textContent = '继续播放';
        for (const { anim } of views) {
          const meta = assets.meta('laugh_frog', anim.name);
          const next = anim.loop ? (anim.currentIndex() + 1) % meta.frames : Math.min(anim.currentIndex() + 1, meta.frames - 1);
          anim.t = next / meta.fps;
        }
      });
      function frame(now) {
        const dt = Math.min((now - last) / 1000, 0.1);
        last = now;
        for (const { ctx, anim, phase } of views) {
          if (!paused) anim.update(dt);
          ctx.clearRect(0, 0, 320, 260);
          anim.draw(ctx, 160, 238, 180, true);
          if (phase) {
            const stages = ['远脚落地', '近脚收回', '近脚越过', '近脚伸出', '近脚落地', '远脚收回', '远脚越过', '远脚伸出'];
            phase.textContent = `· 第${anim.currentIndex() + 1}帧：${stages[anim.currentIndex()]}`;
          }
        }
        requestAnimationFrame(frame);
      }
      status.textContent = '断手统一位于朝向屏幕的一侧。';
      requestAnimationFrame(frame);
    } catch (error) {
      status.textContent = `加载失败：${error.message}`;
    }
  </script>
</body>
</html>
